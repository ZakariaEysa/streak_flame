analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - example/build/**
    - example/**/ephemeral/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    unused_import: error
linter:
  rules:
    - cancel_subscriptions
    - close_sinks
    - hash_and_equals
    - prefer_const_constructors
    - prefer_final_fields
    - public_member_api_docs
    - use_super_parameters